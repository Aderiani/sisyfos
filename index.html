<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sisyfos</title>
    <link rel="stylesheet" href="sisyfos.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="nameDisplay"></div>
    <div id="hud">
        <span id="scoreDisplay">Score: 0</span>
        <span id="attemptsDisplay">Attempts: 0</span>
        <span id="statusDisplay">Push the stone uphill</span>
    </div>

    <div class="controls">
        <button id="leftButton" aria-label="Move left">⬅️</button>
        <button id="upButton" aria-label="Push up">⬆️</button>
        <button id="rightButton" aria-label="Move right">➡️</button>
        <button id="restartButton" aria-label="Restart game">↺</button>
    </div>

    <script src="sisyfos.js"></script>
    <script>
        const userName = prompt("Please enter your name:");
        if (userName) {
            document.getElementById('nameDisplay').innerText = `${userName}'s life!`;
        }
    </script>
</body>
</html>
